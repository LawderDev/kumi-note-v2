name: kumi_note
description: "Kumi Note - AI-powered note taking app with local LLM semantic search"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  cupertino_icons: ^1.0.8
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  freezed_annotation: ^2.4.4
  go_router: ^14.6.2
  json_annotation: ^4.9.0
  logger: ^2.5.0
  package_info_plus: ^8.1.3
  path_provider: ^2.1.5
  riverpod_annotation: ^2.6.1
  shared_preferences: ^2.3.5
  uuid: ^4.5.1

dev_dependencies:
  build_runner: ^2.4.13
  flutter_test:
    sdk: flutter
  freezed: ^2.5.7
  integration_test:
    sdk: flutter
  mocktail: ^1.0.4
  patrol: ^3.2.0
  riverpod_generator: ^2.6.1
  test: ^1.25.8
  very_good_analysis: ^6.0.0

flutter:
  uses-material-design: true